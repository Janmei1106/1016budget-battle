<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Budget Battle｜月底生存挑戰</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF745C'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58'%3E💰%3C/text%3E%3C/svg%3E">
<style>
:root {
  --cream: #FFF5E8;
  --coral: #FF745C;
  --coral-dark: #E4573F;
  --yellow: #FFC857;
  --navy: #24435B;
  --mint: #70C7AE;
  --ink: #24435B;
  --muted: #5C7386;
  --card: #FFFDF9;
  --line: rgba(36, 67, 91, 0.12);
  --danger: #B43333;
  --ok: #1F8A70;
  --shadow: 0 14px 34px rgba(36, 67, 91, 0.1);
  --radius: 28px;
}
* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
body {
  font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% -8%, #ffd7b0 0, transparent 32%),
    radial-gradient(circle at 110% 0%, #c9f3e6 0, transparent 28%),
    var(--cream);
  line-height: 1.55;
  min-height: 100vh;
}
button, input { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 56px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { font-weight: 800; letter-spacing: 0.04em; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.15; margin-bottom: 8px; }
h2 { font-size: 22px; margin-bottom: 8px; }
.lead { font-size: 18px; max-width: 40rem; }
.muted { color: var(--muted); }
.eyebrow { display: inline-block; background: var(--yellow); color: var(--navy); font-weight: 800; border-radius: 999px; padding: 4px 10px; margin-bottom: 10px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; border: 1px solid rgba(255,255,255,.7); }
.stack { display: grid; gap: 14px; }
.hero {
  background:
    radial-gradient(circle at 92% 18%, rgba(255,200,87,.95), transparent 26%),
    radial-gradient(circle at 6% 90%, rgba(112,199,174,.85), transparent 24%),
    var(--card);
  padding: 28px 22px;
}
.btn-row, .chips, .chip-scroll { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; max-width: 100%; }
.btn, .chip, .choice, .icon-btn {
  min-height: 48px;
  border-radius: 999px;
  border: 2px solid transparent;
  font-weight: 800;
  font-size: 16px;
}
.btn { padding: 12px 18px; }
.btn-primary { background: var(--coral); color: white; }
.btn-primary:hover { background: var(--coral-dark); }
.btn-secondary { background: white; color: var(--navy); border-color: var(--line); }
.btn-mint { background: var(--mint); color: var(--navy); }
.btn-yellow { background: var(--yellow); color: var(--navy); }
.btn-ghost { background: transparent; color: var(--navy); border-color: var(--line); padding: 8px 14px; min-height: 44px; }
.btn-danger { background: white; color: var(--danger); border-color: #f0c2c2; }
.btn:disabled, .choice:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-row .btn { flex: 1 1 180px; }
.field { display: block; font-weight: 800; margin-bottom: 14px; }
.field span { display: block; margin-bottom: 6px; }
input[type="text"], input.num {
  width: 100%;
  min-height: 48px;
  border-radius: 16px;
  border: 2px solid var(--line);
  padding: 10px 14px;
  font-size: 16px;
  color: var(--navy);
  background: white;
}
.help, .err { display: block; font-weight: 700; font-size: 13px; margin-top: 6px; }
.help { color: var(--muted); }
.err { color: var(--danger); }
.chip {
  background: white;
  color: var(--navy);
  border-color: var(--line);
  padding: 8px 14px;
}
.chip[aria-pressed="true"], .avatar-btn[aria-pressed="true"] {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}
.avatar-btn[aria-pressed="true"] { background: #fff1ec; color: var(--navy); border-color: var(--coral); }
.avatar-grid, .badge-grid, .stat-grid, .summary-grid { display: grid; gap: 10px; }
.avatar-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.avatar-btn, .badge, .summary, .tx, .hist {
  background: white;
  border-radius: 22px;
  border: 2px solid var(--line);
}
.avatar-btn { padding: 8px 6px 12px; text-align: center; }
.avatar-btn svg { width: min(100%, 120px); height: auto; }
.badge-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.badge, .summary { padding: 12px; }
.badge.locked { opacity: 0.55; filter: grayscale(0.85); }
.badge-icon { font-size: 32px; display: block; }
.summary-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.summary strong, .money { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; }
.money.bad, .minus { color: var(--danger); }
.plus { color: var(--ok); }
.money-wrap { position: relative; min-height: 48px; }
.floater {
  position: absolute;
  left: 0;
  top: -6px;
  font-weight: 900;
  pointer-events: none;
  animation: floatUp 1.15s ease forwards;
}
@keyframes floatUp {
  from { opacity: 0; transform: translateY(8px); }
  20% { opacity: 1; }
  to { opacity: 0; transform: translateY(-16px); }
}
.game-grid, .analysis-grid { display: grid; gap: 14px; }
.status-line { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; }
.bar { height: 12px; background: rgba(36,67,91,.1); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .45s ease; }
.bar.happy > span { background: var(--yellow); }
.bar.energy > span { background: var(--mint); }
.bar.stress > span { background: var(--coral); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(36,67,91,.15); display: block; }
.dots i.on { background: var(--mint); }
.dots i.now { background: var(--coral); box-shadow: 0 0 0 3px rgba(255,116,92,.25); }
.warn, .banner {
  background: #ffe1da;
  color: #8d2b22;
  border-radius: 16px;
  padding: 12px 14px;
  font-weight: 800;
}
.banner { margin-bottom: 14px; }
.fate-scene { perspective: 900px; }
.fate-inner { position: relative; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.7,.2,1); min-height: 210px; }
.fate-inner.flipped { transform: rotateY(180deg); }
.fate-face { border-radius: 24px; padding: 18px; min-height: 210px; }
.fate-back, .fate-front { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.card-back, button.card-back {
  border: 0; width: 100%; text-align: left; font: inherit; display: block; cursor: pointer;
  border-radius: 24px; padding: 18px; min-height: 220px; color: var(--cream);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 24%),
    repeating-linear-gradient(45deg, #24435B 0 12px, #31556f 12px 24px);
}
.fate-back {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 24%),
    repeating-linear-gradient(45deg, #24435B 0 12px, #31556f 12px 24px);
  color: var(--cream);
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
}
.fate-front { background: white; border: 2px solid var(--line); transform: rotateY(180deg); }
.back-mark { font-size: 42px; font-weight: 900; }
.choice {
  width: 100%;
  text-align: left;
  border-radius: 18px;
  border-color: var(--line);
  background: white;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.choice small { display: block; color: var(--muted); font-weight: 700; }
.chart, .donut { width: 100%; height: auto; display: block; }
.legend { display: grid; gap: 8px; }
.legend button {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: 8px;
  align-items: center;
  text-align: left;
  background: white;
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 10px;
  min-height: 48px;
  color: var(--navy);
  font-weight: 700;
}
.legend button[aria-pressed="true"] { border-color: var(--navy); background: #f3f7fb; }
.swatch { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.tx, .hist { padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.tx h3, .hist h3 { font-size: 16px; margin-bottom: 4px; }
.table-wrap { overflow-x: auto; max-width: 100%; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-back {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(36,67,91,.48);
  display: flex; align-items: flex-end; justify-content: center; padding: 16px;
}
.modal { width: min(440px, 100%); }
.pop {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 35; width: min(360px, calc(100% - 24px));
  animation: pop .35s ease;
}
@keyframes pop { from { transform: translateX(-50%) translateY(12px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}
.footer-note { margin-top: 18px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; }
.metrics div { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.metrics dt { color: var(--muted); font-size: 13px; font-weight: 700; }
.metrics dd { margin: 2px 0 0; font-size: 18px; font-weight: 800; }
.tx-meta { margin: 0 0 2px; color: var(--muted); font-size: 13px; }
.row-gap { display: grid; gap: 8px; }
tr.active { background: #fff4d6; }
@media (min-width: 900px) {
  .game-grid { grid-template-columns: 320px 1fr; align-items: start; }
  .analysis-grid { grid-template-columns: 340px 1fr; align-items: start; }
  .modal-back { align-items: center; }
}
@media (max-width: 899px) {
  .game-grid .stack { order: -1; }
}
@media (max-width: 520px) {
  .hist { grid-template-columns: 1fr; align-items: start; }
  .hist .row-gap { grid-auto-flow: column; justify-content: start; }
}
@media (max-width: 420px) {
  .compare { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

function opt(label, money, happiness, energy, stress, category, result) {

}
function eventById(id) {
  for (let i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i];
  return null;
}
function eventTier(event) {
  let spend = 0;
  for (let i = 0; i < event.options.length; i++) spend = Math.max(spend, Math.max(0, -event.options[i].money));
  if (event.category === '意外收入') return 'low';
  if (spend >= 1000) return 'high';
  if (spend >= 300) return 'mid';
  return 'low';
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function sumAmount(list) {
  let s = 0;
  for (let i = 0; i < list.length; i++) s += list[i].amount;
  return s;
}
function formatNT(n) {
  const v = Math.trunc(n);
  const sign = v < 0 ? '-' : '';
  const digits = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign + 'NT$' + digits;
}
function formatSignedNT(n) {
  if (n > 0) return '+' + formatNT(n);
  return formatNT(n);
}
function parseAmount(value) {
  if (typeof value === 'number') {
    if (!Number.isInteger(value)) return { ok: false };
    return { ok: true, value: value };
  }
  const s = String(value == null ? '' : value).trim();
  if (!/^\d+$/.test(s)) return { ok: false };
  const n = Number(s);
  if (!Number.isSafeInteger(n)) return { ok: false };
  return { ok: true, value: n };
}
function validateSettings(raw) {
  const errors = {};
  const source = raw || {};
  const nickname = String(source.nickname == null ? '' : source.nickname).trim();
  const name = nickname || DEFAULT_SETTINGS.nickname;
  if ([...name].length > 16) errors.nickname = '暱稱請在 16 個字以內';
  const avatar = AVATARS.some(a => a.id === source.avatar) ? source.avatar : '';
  if (!avatar) errors.avatar = '請選擇一個角色';
  const monthly = parseAmount(source.monthlyBudget);
  if (!monthly.ok || monthly.value < 1 || monthly.value > 100000) errors.monthlyBudget = '月生活費須為 1～100,000 的整數';

function donutChart(slices) {
  const drawn = slices.filter(s => s.amount > 0);
  const total = drawn.reduce((sum, s) => sum + s.amount, 0);
  if (!total) return '<div class="empty-chart" role="img" aria-label="目前沒有支出">這個範圍還沒有支出，所以圓環圖沒有區塊。</div>';
  const r = 70;
  const c = 2 * Math.PI * r;
  let offset = 0;
  const circles = drawn.map(s => {
    const len = s.amount / total * c;
    const color = CATEGORY_COLORS[s.name] || '#24435B';
    if (drawn.length === 1) return `<circle cx="110" cy="110" r="${r}" fill="none" stroke="${color}" stroke-width="28"></circle>`;
    const node = `<circle cx="110" cy="110" r="${r}" fill="none" stroke="${color}" stroke-width="28" stroke-dasharray="${len} ${Math.max(c - len, 0.01)}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 110)"></circle>`;
    offset += len;
    return node;
  }).join('');
  const label = drawn.map(s => s.name + ' ' + formatNT(s.amount) + ' ' + percentText(s.amount, total)).join('，');
  return `<svg viewBox="0 0 220 220" class="donut" role="img" aria-label="支出分類圓環圖：${esc(label)}"><title>${esc(label)}</title>${circles}<circle cx="110" cy="110" r="48" fill="#FFFDF9"></circle><text x="110" y="106" text-anchor="middle" font-size="13" fill="#24435B">總支出</text><text x="110" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#24435B">${esc(formatNT(total))}</text></svg>`;
}
function lineChart(points, highlight) {
  const w = 680;
  const h = 300;
  const pad = { l: 108, r: 16, t: 22, b: 42 };
  const vals = points.map(p => p.value);
  let minV = Math.min(0, ...vals);
  let maxV = Math.max(0, ...vals);
  if (minV === maxV) maxV = minV + 1;
  const span = maxV - minV || 1;
  const padV = span * 0.12;
  const min = minV < 0 ? minV - padV : minV;
  const max = maxV + padV;
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const x = i => points.length === 1 ? pad.l + innerW / 2 : pad.l + innerW * i / (points.length - 1);
  const y = v => pad.t + (max - v) / (max - min) * innerH;
  const coords = points.map((p, i) => x(i) + ',' + y(p.value)).join(' ');
  const dots = points.map((p, i) => {
    const active = highlight && p.key === highlight;
    return `<circle cx="${x(i)}" cy="${y(p.value)}" r="${active ? 6 : 4}" fill="${p.value < 0 ? '#D64545' : '#24435B'}"></circle><text x="${x(i)}" y="${h - 14}" text-anchor="middle" font-size="12" fill="#24435B">${esc(p.short)}</text>`;
  }).join('');
  const ticks = [maxV, 0, minV].filter((v, i, arr) => arr.indexOf(v) === i);
  const labels = ticks.map(v => `<text x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#24435B">${esc(formatNT(v))}</text>`).join('');
  const caption = '餘額由 ' + formatNT(points[0].value) + ' 到 ' + formatNT(points[points.length - 1].value);
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="餘額變化折線圖，${esc(caption)}"><title>${esc(caption)}</title><text x="${pad.l}" y="16" font-size="13" fill="#24435B">餘額（新臺幣）</text><line x1="${pad.l}" y1="${y(0)}" x2="${w - pad.r}" y2="${y(0)}" stroke="rgba(36,67,91,.35)" stroke-dasharray="4 4"></line><polyline points="${coords}" fill="none" stroke="#FF745C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline>${dots}${labels}</svg>`;
}

  const game = state.currentGame;
  if (!game) return;
  const res = revealEvent(game);
  if (!res.ok) return;
  saveState();
  say('命運卡已翻開。');
  if (prefersReducedMotion()) { fx.animateFlip = false; fx.hideOptions = false; render(); return; }
  fx.animateFlip = true;
  fx.hideOptions = true;
  const token = ++fx.flipToken;
  render();
  window.setTimeout(() => {
    if (token !== fx.flipToken) return;
    fx.hideOptions = false;
    if (state.ui.screen === 'game') render({ keep: true });
  }, 640);
}
function doChoose(index) {
  const game = state.currentGame;
  if (!game || fx.hideOptions) return;
  const res = applyChoice(game, index);
  if (!res.ok) return;
  const fresh = newlyUnlocked(game);
  saveState();
  fx.float = { amount: res.option.money };
  say('你選擇' + res.option.label + '。餘額 ' + formatNT(computeStats(game).finalBalance) + '。');
  enqueueBadges(fresh);
  render();
}
function doNext() {
  const game = state.currentGame;
  if (!game) return;
  if (game.round >= 10 && game.roundProgress.choiceIndex !== null) { doFinalize(); return; }
  const res = advanceRound(game);
  if (!res.ok) return;
  resetMotion();
  saveState();
  if (res.livingCost) fx.float = { amount: -res.livingCost };
  const days = roundDays(game.round);
  say('進入第 ' + game.round + ' 回合，第 ' + days.start + ' 到 ' + days.end + ' 天。');
  render();
}
function doFinalize() {
  const game = state.currentGame;
  if (!game) return;
  if (game.status === 'finished') { state.ui.screen = 'ending'; saveState(); render(); return; }
  if (game.round < 10 || game.balanceByRound.length < 10 || game.roundProgress.choiceIndex === null) return;
  game.status = 'finished';
  game.finishedAt = new Date().toISOString();
  const stats = computeStats(game);
  const endingId = determineEnding(game, stats);
  game.endingId = endingId;
  const achievements = evaluateAchievements(game, stats);
  const fresh = achievements.filter(id => state.unlocked.indexOf(id) === -1);
  achievements.forEach(id => { if (state.unlocked.indexOf(id) === -1) state.unlocked.push(id); });
  state.history = pushHistory(state.history, makeHistoryRecord(game, stats, endingId, achievements));
  state.ui.screen = 'ending';
  state.ui.historyId = null;
  resetMotion();
  saveState();
  say('月底結算：' + ENDINGS[endingId].name + '。最終餘額 ' + formatNT(stats.finalBalance) + '。');
  enqueueBadges(fresh);
  render();
}
function openAnalysis(from) {
  state.ui.analysisReturn = from;
  if (from !== 'history') state.ui.historyId = null;
  state.ui.category = 'all';
  state.ui.round = 'all';
  state.ui.screen = 'analysis';
  saveState();
  render();
}
function openHistory(id) {
  state.ui.historyId = id;
  state.ui.analysisReturn = 'history';
  state.ui.category = 'all';
  state.ui.round = 'all';
  state.ui.screen = 'analysis';
  saveState();
  render();
}
function deleteHistory(id) {
  const item = state.history.find(h => h.id === id);
  if (!item) return;
  askConfirm('刪除這筆紀錄？', item.settings.nickname + ' 在 ' + formatTime(item.finishedAt) + ' 的挑戰會從這個瀏覽器移除。', '刪除', '取消').then(ok => {
    if (!ok) return;
    state.history = state.history.filter(h => h.id !== id);
    if (state.ui.historyId === id) { state.ui.historyId = null; state.ui.screen = 'history'; }
    saveState();
    render();
  });
}
function clearHistory() {
  askConfirm('清除全部歷史紀錄？', '這會刪掉這個瀏覽器裡已完成的挑戰紀錄，且無法復原。成就徽章和進行中的遊戲會保留。', '全部清除', '取消').then(ok => {
    if (!ok) return;
    state.history = [];
    state.ui.historyId = null;
    if (state.ui.screen === 'analysis' && state.ui.analysisReturn === 'history') state.ui.screen = 'history';
    saveState();
    render();
  });
}
function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || !app.contains(el)) return;
  const action = el.dataset.action;
  if (action === 'go') { state.ui.screen = el.dataset.screen; saveState(); render(); }
  else if (action === 'preset') { state.draft.monthlyBudget = el.dataset.value; saveState(); render(); }
  else if (action === 'avatar') { state.draft.avatar = el.dataset.id; saveState(); render(); }
  else if (action === 'start') tryStart();
  else if (action === 'continue') { state.ui.screen = state.currentGame && state.currentGame.status === 'finished' ? 'ending' : 'game'; saveState(); render(); }
  else if (action === 'flip') doFlip();
  else if (action === 'choose') doChoose(Number(el.dataset.index));
  else if (action === 'next') doNext();
  else if (action === 'analysis') openAnalysis(el.dataset.screen || 'game');
  else if (action === 'filter-cat') { state.ui.category = state.ui.category === el.dataset.cat ? 'all' : el.dataset.cat; saveState(); render({ keep: true }); }
  else if (action === 'filter-round') { state.ui.round = el.dataset.round; saveState(); render({ keep: true }); }
  else if (action === 'history-open') openHistory(el.dataset.id);
  else if (action === 'history-delete') deleteHistory(el.dataset.id);
  else if (action === 'history-clear') clearHistory();
  else if (action === 'again') playAgain();
  else if (action === 'abandon') {
    askConfirm('放棄這局？', '這局還沒結束，放棄後不會寫進歷史紀錄。已經解鎖的徽章會留著。', '放棄', '繼續玩').then(ok => {
      if (!ok) return;
      resetMotion();
      state.currentGame = null;
      state.ui.screen = 'home';
      saveState();
      render();
    });
  } else if (action === 'dismiss-notice') { sessionNotice = ''; render(); }
}
function onInput(e) {
  const field = e.target.getAttribute('data-field');
  if (!field) return;
  state.draft[field] = e.target.value;
  saveState();
  render({ keep: true });
}
function onKey(e) {
  if (e.key === 'Enter' && state.ui.screen === 'setup' && e.target.tagName === 'INPUT') {
    e.preventDefault();
    tryStart();
  }
}
function boot() {
  if (!document.getElementById('live')) {
    const live = document.createElement('div');
    live.id = 'live';
    live.className = 'sr-only';
    live.setAttribute('aria-live', 'polite');
    document.body.appendChild(live);
  }
  const loaded = loadStored();
  state = loaded.state;
  sessionNotice = loaded.notice || '';
  if (sessionNotice) saveState();
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  app.addEventListener('keydown', onKey);
  render();
}
boot();

</script>
